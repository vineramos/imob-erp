name: Bootstrap Document Storage

on:
  push:
    branches: [sprint-1-foundation]
    paths:
      - '.github/workflows/storage-bootstrap.yml'

concurrency:
  group: storage-bootstrap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bootstrap-storage:
    if: vars.GCP_WIF_READY == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_WIF_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Provision private document bucket
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION }}
          SERVICE: ${{ vars.GCP_SERVICE }}
        shell: bash
        run: |
          set -euo pipefail

          BUCKET_NAME="${PROJECT_ID}-imob-documents"
          BUCKET_URI="gs://${BUCKET_NAME}"

          if gcloud storage buckets describe "$BUCKET_URI" --project "$PROJECT_ID" >/dev/null 2>&1; then
            echo "Document bucket already exists."
          else
            echo "Creating private document bucket in ${REGION}."
            gcloud storage buckets create "$BUCKET_URI" \
              --project "$PROJECT_ID" \
              --location "$REGION" \
              --uniform-bucket-level-access
          fi

          RUNTIME_SA="$(gcloud run services describe "$SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --format='value(spec.template.spec.serviceAccountName)')"

          if [[ -z "$RUNTIME_SA" ]]; then
            PROJECT_NUMBER="$(gcloud projects describe "$PROJECT_ID" --format='value(projectNumber)')"
            RUNTIME_SA="${PROJECT_NUMBER}-compute@developer.gserviceaccount.com"
          fi

          echo "Granting object access to the Cloud Run runtime service account."
          gcloud storage buckets add-iam-policy-binding "$BUCKET_URI" \
            --member="serviceAccount:${RUNTIME_SA}" \
            --role="roles/storage.objectAdmin" >/dev/null

          echo "DOCUMENT_BUCKET=${BUCKET_NAME}" >> "$GITHUB_ENV"

      - name: Configure Cloud Run document storage
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION }}
          SERVICE: ${{ vars.GCP_SERVICE }}
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services update "$SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --update-env-vars="DOCUMENT_STORAGE_BUCKET=${DOCUMENT_BUCKET},DOCUMENT_STORAGE_PREFIX=imob-erp" \
            --quiet

      - name: Verify storage configuration
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION }}
          SERVICE: ${{ vars.GCP_SERVICE }}
        shell: bash
        run: |
          set -euo pipefail
          SERVICE_JSON="$(mktemp)"
          trap 'rm -f "$SERVICE_JSON"' EXIT

          gcloud run services describe "$SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --format=json > "$SERVICE_JSON"

          python - "$SERVICE_JSON" "$DOCUMENT_BUCKET" <<'PY'
          import json
          import sys

          service_path, expected_bucket = sys.argv[1:]
          data = json.load(open(service_path, encoding='utf-8'))
          containers = (((data.get('spec') or {}).get('template') or {}).get('spec') or {}).get('containers') or []
          env = containers[0].get('env') or [] if containers else []
          values = {item.get('name'): item.get('value') for item in env if isinstance(item, dict)}
          actual = values.get('DOCUMENT_STORAGE_BUCKET')
          prefix = values.get('DOCUMENT_STORAGE_PREFIX')
          if actual != expected_bucket:
              raise SystemExit(f'DOCUMENT_STORAGE_BUCKET mismatch: {actual!r}')
          if prefix != 'imob-erp':
              raise SystemExit(f'DOCUMENT_STORAGE_PREFIX mismatch: {prefix!r}')
          print('Cloud Run document storage configuration: OK')
          PY

          gcloud storage buckets describe "gs://${DOCUMENT_BUCKET}" \
            --project "$PROJECT_ID" \
            --format='value(name,location)'
