name: Apply contextual document tabs

on:
  push:
    branches: [sprint-1-foundation]

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, '[apply-doc-tabs]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sprint-1-foundation
      - name: Patch contextual document tabs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if old not in text:
                  raise SystemExit(f"marker not found: {label}")
              return text.replace(old, new, 1)

          # Stabilize related-entity dependency in the reusable panel.
          path = Path('frontend/src/modules/documents/EntityDocumentsPanel.tsx')
          text = path.read_text()
          text = replace_once(
              text,
              "  const refs=useMemo(()=>{\n    const map=new Map<string,DocumentEntityRef>()\n    ;[{type:entityType,id:entityId},...relatedEntities].forEach(ref=>map.set(`${ref.type}:${ref.id}`,ref))\n    return [...map.values()]\n  },[entityType,entityId,relatedEntities])",
              "  const relatedSignature=useMemo(()=>relatedEntities.map(ref=>`${ref.type}:${ref.id}`).sort().join('|'),[relatedEntities])\n  const refs=useMemo(()=>{\n    const map=new Map<string,DocumentEntityRef>()\n    ;[{type:entityType,id:entityId},...relatedEntities].forEach(ref=>map.set(`${ref.type}:${ref.id}`,ref))\n    return [...map.values()]\n  },[entityType,entityId,relatedSignature])",
              'panel stable related entities',
          )
          path.write_text(text)

          # Property: replace the old contract-status placeholder with the real document folder.
          path = Path('frontend/src/modules/properties/PropertyWorkspacePage.tsx')
          text = path.read_text()
          text = replace_once(text, "import { PropertyMaintenancePanel } from './PropertyMaintenancePanel'", "import { PropertyMaintenancePanel } from './PropertyMaintenancePanel'\nimport { EntityDocumentsPanel } from '../documents/EntityDocumentsPanel'", 'property import')
          start = text.index("      {detailTab==='documents'&&")
          end = text.index("\n      {detailTab==='inspections'&&", start)
          replacement = "      {detailTab==='documents'&&<EntityDocumentsPanel entityType=\"property\" entityId={selected.id} entityLabel={`Imóvel ${selected.code}`} permissions={permissions} relatedEntities={[...adminContracts.map(item=>({type:'administration_contract' as const,id:item.id})),...leases.map(item=>({type:'lease_contract' as const,id:item.id})),...inspections.map(item=>({type:'inspection' as const,id:item.id}))]}/>}"
          text = text[:start] + replacement + text[end:]
          path.write_text(text)

          # Person: add Documents as a real edit-tab, fixed to that person.
          path = Path('frontend/src/modules/properties/PeopleWorkspacePage.tsx')
          text = path.read_text()
          text = replace_once(text, "import type { Address, Person, PersonCreate } from '../../api/types'", "import type { Address, Person, PersonCreate } from '../../api/types'\nimport { EntityDocumentsPanel } from '../documents/EntityDocumentsPanel'", 'people import')
          text = replace_once(text, "type PersonTab = 'main' | 'address' | 'bank' | 'profile'", "type PersonTab = 'main' | 'address' | 'bank' | 'profile' | 'documents'", 'people tab type')
          text = replace_once(text, "{tabButton('profile','Contratuais',FileText)}</div>", "{tabButton('profile','Contratuais',FileText)}{editingId&&permissions.includes('documents.view')&&tabButton('documents','Documentos',FileText)}</div>", 'people tab button')
          marker = "    </div><div className=\"form-actions portfolio-modal-actions\">"
          insertion = "      {activeTab==='documents'&&editingId&&<EntityDocumentsPanel entityType=\"person\" entityId={editingId} entityLabel={form.name||'Pessoa'} permissions={permissions} compact/>}\n"
          if marker not in text:
              raise SystemExit('marker not found: people modal footer')
          text = text.replace(marker, insertion + marker, 1)
          path.write_text(text)

          # Administration contract: tabs inside expanded detail.
          path = Path('frontend/src/modules/contracts/ContractsPage.tsx')
          text = path.read_text()
          text = replace_once(text, "import { SignatureTimeline } from './SignatureTimeline'", "import { SignatureTimeline } from './SignatureTimeline'\nimport { EntityDocumentsPanel } from '../documents/EntityDocumentsPanel'", 'admin import')
          text = replace_once(text, "  const [expanded, setExpanded] = useState<string | null>(null)", "  const [expanded, setExpanded] = useState<string | null>(null)\n  const [expandedTab, setExpandedTab] = useState<'details' | 'documents'>('details')", 'admin expanded state')
          text = replace_once(text, "onClick={() => setExpanded(isExpanded ? null : item.id)}", "onClick={() => { setExpanded(isExpanded ? null : item.id); setExpandedTab('details') }}", 'admin expand click')
          text = replace_once(text, "{isExpanded && <div className=\"contract-expanded-detail contract-expanded-three\">", "{isExpanded && <><div className=\"entity-document-tabs\"><button type=\"button\" className={expandedTab==='details'?'active':''} onClick={()=>setExpandedTab('details')}>Detalhes</button><button type=\"button\" className={expandedTab==='documents'?'active':''} onClick={()=>setExpandedTab('documents')}>Documentos</button></div>{expandedTab==='details'&&<div className=\"contract-expanded-detail contract-expanded-three\">", 'admin expanded opening')
          text = replace_once(text, "<SignatureTimeline contractId={item.id}/></div>}", "<SignatureTimeline contractId={item.id}/></div>}{expandedTab==='documents'&&<EntityDocumentsPanel entityType=\"administration_contract\" entityId={item.id} entityLabel={item.code} permissions={permissions} compact/>}</>}", 'admin expanded closing')
          path.write_text(text)

          # Lease contract: same contextual Documents tab.
          path = Path('frontend/src/modules/contracts/LeaseContractsPage.tsx')
          text = path.read_text()
          text = replace_once(text, "import { SignatureTimeline } from './SignatureTimeline'", "import { SignatureTimeline } from './SignatureTimeline'\nimport { EntityDocumentsPanel } from '../documents/EntityDocumentsPanel'", 'lease import')
          text = replace_once(text, "  const [expanded, setExpanded] = useState<string | null>(null)", "  const [expanded, setExpanded] = useState<string | null>(null)\n  const [expandedTab, setExpandedTab] = useState<'details' | 'documents'>('details')", 'lease expanded state')
          text = replace_once(text, "onClick={() => setExpanded(isExpanded ? null : item.id)}", "onClick={() => { setExpanded(isExpanded ? null : item.id); setExpandedTab('details') }}", 'lease expand click')
          text = replace_once(text, "{isExpanded && <div className=\"contract-expanded\">", "{isExpanded && <><div className=\"entity-document-tabs\"><button type=\"button\" className={expandedTab==='details'?'active':''} onClick={()=>setExpandedTab('details')}>Detalhes</button><button type=\"button\" className={expandedTab==='documents'?'active':''} onClick={()=>setExpandedTab('documents')}>Documentos</button></div>{expandedTab==='details'&&<div className=\"contract-expanded\">", 'lease expanded opening')
          text = replace_once(text, "<SignatureTimeline contractId={item.id} contractType=\"lease\"/>\n            </div>}", "<SignatureTimeline contractId={item.id} contractType=\"lease\"/>\n            </div>}{expandedTab==='documents'&&<EntityDocumentsPanel entityType=\"lease_contract\" entityId={item.id} entityLabel={item.code} permissions={permissions} compact/>}</>}", 'lease expanded closing')
          path.write_text(text)

          # Shared styling for the small tabs used in both contract types.
          css = Path('frontend/src/modules/documents/entity-documents.css')
          style = css.read_text()
          style += "\n.entity-document-tabs{display:flex;gap:4px;margin-top:12px;border-bottom:1px solid var(--border)}.entity-document-tabs button{border:0;background:transparent;color:var(--muted-text);padding:9px 12px;font-weight:700;font-size:12px;cursor:pointer;border-bottom:2px solid transparent}.entity-document-tabs button.active{color:var(--text);border-bottom-color:var(--primary)}\n"
          css.write_text(style)
          PY
      - name: Commit patched files and remove helper workflow
        shell: bash
        run: |
          git config user.name "vineramos"
          git config user.email "97920119+vineramos@users.noreply.github.com"
          git rm .github/workflows/apply-document-context-tabs.yml
          git add frontend/src/modules/documents/EntityDocumentsPanel.tsx frontend/src/modules/documents/entity-documents.css frontend/src/modules/properties/PropertyWorkspacePage.tsx frontend/src/modules/properties/PeopleWorkspacePage.tsx frontend/src/modules/contracts/ContractsPage.tsx frontend/src/modules/contracts/LeaseContractsPage.tsx
          git commit -m "Vincular documentos a imóveis pessoas e contratos"
          git push origin HEAD:sprint-1-foundation
