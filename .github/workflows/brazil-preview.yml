name: Brazil Preview

on:
  push:
    branches: [sprint-1-foundation]

jobs:
  clone-cloud-run-to-brazil:
    if: contains(github.event.head_commit.message, '[brazil-preview]')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_WIF_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Deploy parallel Cloud Run service in Sao Paulo
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          SOURCE_REGION: us-east1
          TARGET_REGION: southamerica-east1
          SOURCE_SERVICE: ${{ vars.GCP_SERVICE }}
          TARGET_SERVICE: imob-erp-br
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_JSON="$(mktemp)"
          ENV_FILE="$(mktemp)"
          META_FILE="$(mktemp)"
          trap 'rm -f "$SOURCE_JSON" "$ENV_FILE" "$META_FILE"' EXIT

          gcloud run services describe "$SOURCE_SERVICE" \
            --project "$PROJECT_ID" \
            --region "$SOURCE_REGION" \
            --format=json > "$SOURCE_JSON"

          python - "$SOURCE_JSON" "$ENV_FILE" "$META_FILE" <<'PY'
          import json
          import sys

          source_path, env_path, meta_path = sys.argv[1:]
          data = json.load(open(source_path, encoding="utf-8"))
          spec = (data.get("spec") or {}).get("template", {}).get("spec", {})
          containers = spec.get("containers") or []
          if not containers:
              raise SystemExit("Cloud Run source has no container")
          container = containers[0]
          image = str(container.get("image") or "").strip()
          if not image:
              raise SystemExit("Cloud Run source image not found")

          plain_env = {}
          secret_refs = []
          for item in container.get("env") or []:
              name = str(item.get("name") or "").strip()
              if not name:
                  continue
              if "value" in item:
                  plain_env[name] = str(item.get("value") or "")
                  continue
              ref = (item.get("valueFrom") or {}).get("secretKeyRef") or {}
              secret = str(ref.get("name") or "").strip()
              version = str(ref.get("key") or "latest").strip() or "latest"
              if secret:
                  secret_refs.append(f"{name}={secret}:{version}")

          with open(env_path, "w", encoding="utf-8") as fh:
              json.dump(plain_env, fh)

          service_account = str(spec.get("serviceAccountName") or "").strip()
          with open(meta_path, "w", encoding="utf-8") as fh:
              fh.write(f"IMAGE={image}\n")
              fh.write(f"SERVICE_ACCOUNT={service_account}\n")
              fh.write(f"SECRETS={','.join(secret_refs)}\n")
          PY

          # shellcheck disable=SC1090
          source "$META_FILE"
          ARGS=(
            run deploy "$TARGET_SERVICE"
            --project "$PROJECT_ID"
            --region "$TARGET_REGION"
            --image "$IMAGE"
            --quiet
            --allow-unauthenticated
          )
          if [[ -s "$ENV_FILE" ]]; then
            ARGS+=(--env-vars-file "$ENV_FILE")
          fi
          if [[ -n "${SECRETS:-}" ]]; then
            ARGS+=(--set-secrets "$SECRETS")
          fi
          if [[ -n "${SERVICE_ACCOUNT:-}" ]]; then
            ARGS+=(--service-account "$SERVICE_ACCOUNT")
          fi

          if ! gcloud "${ARGS[@]}"; then
            echo "Public IAM binding was not available; retrying with Cloud Run invoker IAM check disabled."
            FALLBACK=(
              run deploy "$TARGET_SERVICE"
              --project "$PROJECT_ID"
              --region "$TARGET_REGION"
              --image "$IMAGE"
              --quiet
              --no-invoker-iam-check
            )
            if [[ -s "$ENV_FILE" ]]; then
              FALLBACK+=(--env-vars-file "$ENV_FILE")
            fi
            if [[ -n "${SECRETS:-}" ]]; then
              FALLBACK+=(--set-secrets "$SECRETS")
            fi
            if [[ -n "${SERVICE_ACCOUNT:-}" ]]; then
              FALLBACK+=(--service-account "$SERVICE_ACCOUNT")
            fi
            gcloud "${FALLBACK[@]}"
          fi

      - name: Smoke test Brazil service
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          TARGET_REGION: southamerica-east1
          TARGET_SERVICE: imob-erp-br
        shell: bash
        run: |
          set -euo pipefail
          SERVICE_URL="$(gcloud run services describe "$TARGET_SERVICE" --project "$PROJECT_ID" --region "$TARGET_REGION" --format='value(status.url)')"
          echo "Brazil service URL: ${SERVICE_URL}"
          curl --silent --show-error --fail --max-time 20 "${SERVICE_URL}/runtime-config.js" >/dev/null
          CODE="$(curl --silent --show-error --output /tmp/imob-br-auth.json --write-out '%{http_code}' --max-time 25 \
            -X POST "${SERVICE_URL}/api/auth/sign-in" \
            -H 'Content-Type: application/json' \
            --data '{"email":"imob-auth-smoke@example.invalid","password":"invalid-smoke-password-123"}' || true)"
          if [[ "$CODE" != "401" ]]; then
            echo "Brazil Auth proxy smoke failed (HTTP ${CODE})"
            exit 1
          fi
          echo "Brazil preview ready: ${SERVICE_URL}"
