name: Brazil Preview

on:
  push:
    branches: [sprint-1-foundation]

jobs:
  clone-cloud-run-to-brazil:
    if: contains(github.event.head_commit.message, '[brazil-preview]')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_WIF_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Ensure Cloud Resource Manager API
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          gcloud services enable cloudresourcemanager.googleapis.com \
            --project "$PROJECT_ID" \
            --quiet

      - name: Clone current Cloud Run service to Sao Paulo
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          SOURCE_REGION: us-east1
          TARGET_REGION: southamerica-east1
          SOURCE_SERVICE: ${{ vars.GCP_SERVICE }}
          TARGET_SERVICE: imob-erp-br
        shell: bash
        run: |
          set -euo pipefail
          EXPORT_FILE="$(mktemp)"
          trap 'rm -f "$EXPORT_FILE"' EXIT

          gcloud run services describe "$SOURCE_SERVICE" \
            --project "$PROJECT_ID" \
            --region "$SOURCE_REGION" \
            --format=export > "$EXPORT_FILE"

          python - "$EXPORT_FILE" "$SOURCE_SERVICE" "$TARGET_SERVICE" <<'PY'
          import re
          import sys

          path, source, target = sys.argv[1:]
          text = open(path, encoding="utf-8").read()
          text, count = re.subn(
              rf"(?m)^(\s*name:\s*){re.escape(source)}\s*$",
              rf"\1{target}",
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit("Could not rewrite Cloud Run service name")

          drop_markers = (
              "run.googleapis.com/urls:",
              "run.googleapis.com/operation-id:",
              "run.googleapis.com/client-name:",
              "run.googleapis.com/client-version:",
              "serving.knative.dev/creator:",
              "serving.knative.dev/lastModifier:",
          )
          lines = [line for line in text.splitlines() if not any(marker in line for marker in drop_markers)]
          open(path, "w", encoding="utf-8").write("\n".join(lines) + "\n")
          PY

          gcloud run services replace "$EXPORT_FILE" \
            --project "$PROJECT_ID" \
            --region "$TARGET_REGION" \
            --quiet

          gcloud run services add-iam-policy-binding "$TARGET_SERVICE" \
            --project "$PROJECT_ID" \
            --region "$TARGET_REGION" \
            --member="allUsers" \
            --role="roles/run.invoker" \
            --quiet >/dev/null

      - name: Smoke test Brazil service
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          TARGET_REGION: southamerica-east1
          TARGET_SERVICE: imob-erp-br
        shell: bash
        run: |
          set -euo pipefail
          SERVICE_URL="$(gcloud run services describe "$TARGET_SERVICE" --project "$PROJECT_ID" --region "$TARGET_REGION" --format='value(status.url)')"
          echo "Brazil service URL: ${SERVICE_URL}"
          curl --silent --show-error --fail --max-time 20 "${SERVICE_URL}/runtime-config.js" >/dev/null
          CODE="$(curl --silent --show-error --output /tmp/imob-br-auth.json --write-out '%{http_code}' --max-time 25 \
            -X POST "${SERVICE_URL}/api/auth/sign-in" \
            -H 'Content-Type: application/json' \
            --data '{"email":"imob-auth-smoke@example.invalid","password":"invalid-smoke-password-123"}' || true)"
          if [[ "$CODE" != "401" ]]; then
            echo "Brazil Auth proxy smoke failed (HTTP ${CODE})"
            exit 1
          fi
          echo "Brazil preview ready: ${SERVICE_URL}"
