name: Portal document privacy patch

on:
  push:
    branches: [sprint-1-foundation]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Preparar proteção documental do portal'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sprint-1-foundation
          fetch-depth: 1
      - name: Restrict tenant documents and add regression
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          route = Path('backend/app/api/routes/tenant_portal.py')
          text = route.read_text(encoding='utf-8')
          old = '''        ) or []:\n            unique[row.key] = row\n'''
          new = '''        ) or []:\n            if row.entity_type in {"lease_contract", "inspection"}:\n                unique[row.key] = row\n'''
          if old not in text:
              raise SystemExit('document rows marker not found')
          text = text.replace(old, new, 1)
          old = '''        ) or []\n        keys.update(row.key for row in rows)\n'''
          new = '''        ) or []\n        keys.update(row.key for row in rows if row.entity_type in {"lease_contract", "inspection"})\n'''
          if old not in text:
              raise SystemExit('allowed keys marker not found')
          route.write_text(text.replace(old, new, 1), encoding='utf-8')

          test = Path('backend/tests/test_tenant_portal.py')
          text = test.read_text(encoding='utf-8')
          marker = '''    assert created["status"] == "requested"\n\n    refreshed = assert_response(client.get("/api/tenant-portal/overview")).json()\n'''
          replacement = '''    assert created["status"] == "requested"\n\n    internal_document = assert_response(\n        client.post(\n            "/api/documents",\n            data={\n                "title": "Orçamento interno do parceiro",\n                "category": "maintenance",\n                "entity_type": "maintenance",\n                "entity_id": created["id"],\n                "notes": "Documento deliberadamente interno para validar privacidade do portal.",\n            },\n            files={"file": ("orcamento-interno.txt", b"custo interno do parceiro", "text/plain")},\n        ),\n        201,\n    ).json()\n\n    refreshed = assert_response(client.get("/api/tenant-portal/overview")).json()\n    assert all(item["key"] != f"managed:{internal_document['id']}" for item in refreshed["documents"])\n    assert client.get(f"/api/tenant-portal/documents/managed:{internal_document['id']}/content").status_code == 404\n'''
          if marker not in text:
              raise SystemExit('test marker not found')
          test.write_text(text.replace(marker, replacement, 1), encoding='utf-8')

          Path('.github/workflows/portal-document-privacy-patch.yml').unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restringir documentos internos no Portal do Inquilino"
          git push origin HEAD:sprint-1-foundation
